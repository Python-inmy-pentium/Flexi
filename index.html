<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 3D CAD Models</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f0f0;
    }
    header {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #333;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem;
      justify-content: center;
    }
    .card {
      flex: 1 1 300px;
      max-width: 500px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .card h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      color: #444;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    model-viewer {
      width: 100%;
      height: 400px;
      background-color: #ffffff;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <header>
    <h1>My 3D CAD Models</h1>
  </header>

  <div class="gallery">

    <!-- ===== MODEL 1 ===== -->
    <div class="card">
      <h2>Model 1</h2>
      <model-viewer
        src="pcv_assembly.glb"
        alt="Model 1"
        auto-rotate
        camera-controls
        ar
        shadow-intensity="1"
        environment-image="neutral"
        exposure="0.8">
      </model-viewer>
    </div>

    <!-- ===== MODEL 2 ===== -->
    <div class="card">
      <h2>Model 2</h2>
      <model-viewer
        src="pipe_12_sch10_class_300.glb"
        alt="Model 2"
        auto-rotate
        camera-controls
        ar
        shadow-intensity="1"
        environment-image="neutral"
        exposure="0.8">
      </model-viewer>
    </div>

    <!-- ===== MODEL 3 ===== -->
    <div class="card">
      <h2>Model 3</h2>
      <model-viewer
        src="pipe_bend_12_sch10_class_300.glb"
        alt="Model 3"
        auto-rotate
        camera-controls
        ar
        shadow-intensity="1"
        environment-image="neutral"
        exposure="0.8">
      </model-viewer>
    </div>

  </div>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</body>
</html>
